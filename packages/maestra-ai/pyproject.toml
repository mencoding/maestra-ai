[project]
name = "maestra-ai"
version = "0.4.2"
description = "Spotify controller with context-aware curation for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Leonardo Menzani Silva" }
]
dependencies = [
    "spotipy>=2.23",
    "python-dotenv>=1.0",
    "rich>=13",
    "rich-argparse>=1.5",
    "keyring>=24",
]

[project.scripts]
maestra = "maestra_ai.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "freezegun>=1.4",
    "ruff>=0.5",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maestra_ai"]

[tool.hatch.build.targets.wheel.force-include]
"src/maestra_ai/docs" = "maestra_ai/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RET"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
