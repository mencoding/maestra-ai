[project]
name = "maestra-ai"
version = "0.1.1"
description = "Spotify controller with context-aware curation for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Leonardo Menzani Silva" }
]
dependencies = [
    "spotipy>=2.23",
    "python-dotenv>=1.0",
]

[project.scripts]
maestra = "maestra_ai.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maestra_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
