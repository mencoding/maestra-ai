name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install workspace (all extras)
        run: uv sync --all-extras

      - name: Run maestra-ai tests
        run: uv run pytest packages/maestra-ai/tests -q

      - name: Run maestra-mcp tests
        run: uv run pytest packages/maestra-mcp/tests -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python 3.11
        run: uv python install 3.11

      - name: Install workspace
        run: uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check packages/
